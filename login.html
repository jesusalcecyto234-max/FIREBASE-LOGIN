<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>LOGIN</title>
</head>
<body>

    <div class="container py-4">
        <div class="card shadow-sm mx-auto" style="max-width: 22rem;">
            <div class="card-body">
                <h3 class="card-title text-center">LOGIN</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email:</label>
                        <input type="email" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2 w-100 fw-bold" style="background-color: #007bff; border-color: #007bff;">
                        Iniciar Sesion
                    </button>
                    <div class="mt-3 text-center">
                        <a href="registro.html">Registro</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import {
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const loginForm = document.getElementById("loginForm");

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const token = await user.getIdToken();
                sessionStorage.setItem("firebaseIdToken", token);
                window.location.href = "./hola.html";
            }
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const credencial = await signInWithEmailAndPassword(auth, email, password);
                const token = await credencial.user.getIdToken();
                sessionStorage.setItem("firebaseIdToken", token);

                if (window.Swal) {
                    await Swal.fire({
                        icon: "success",
                        title: "¡Bienvenido!",
                        text: "Sesión iniciada correctamente.",
                        timer: 1000,
                        showConfirmButton: false
                    });
                }
                window.location.href = "./hola.html";
            } catch (error) {
                if (window.Swal) {
                    Swal.fire({
                        icon: "error",
                        title: "Error al iniciar sesión",
                        text: error.message
                    });
                } else {
                    alert("Error: " + error.message);
                }
            }
        });
    </script>
</body>
</html>
