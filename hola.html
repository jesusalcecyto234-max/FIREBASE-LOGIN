<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Hola</title>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 34rem;">
            <div class="card-body">
                <h3 class="card-title">¡Hola!</h3>
                <p class="text-secondary" id="usuarioInfo">Verificando sesión...</p>

                <button type="button" id="logoutBtn" class="btn btn-outline-danger">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/bootstrap.bundle.min.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>

    <script type="module">
        import { auth } from "./firebase-config.js";
        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        const usuarioInfo = document.getElementById("usuarioInfo");
        const logoutBtn = document.getElementById("logoutBtn");
        const TOKEN_KEY = "firebaseIdToken";
        const LOGIN_URL = "./index.html";

        let checker = null;
        let yaSalio = false;
        let listoParaVigilar = false;

        function salirDeSesion() {
            if (yaSalio) return;
            yaSalio = true;
            listoParaVigilar = false;

            if (checker) {
                clearInterval(checker);
                checker = null;
            }

            try {
                localStorage.removeItem(TOKEN_KEY);
            } catch (_) {}

            usuarioInfo.textContent = "Verificando sesión...";

            signOut(auth).catch((err) => {
                console.error("Error en signOut:", err);
            });

            setTimeout(() => {
                window.location.replace(LOGIN_URL);
            }, 50);
        }

        function revisarLocalStorage() {
            if (yaSalio || !listoParaVigilar) return;
            const val = localStorage.getItem(TOKEN_KEY);
            if (!val) {
                salirDeSesion();
            }
        }

        checker = setInterval(revisarLocalStorage, 200);

        window.addEventListener("storage", (e) => {
            if (e.key === TOKEN_KEY && (e.newValue === null || e.newValue === "")) {
                salirDeSesion();
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (yaSalio) return;

            if (!user) {
                salirDeSesion();
                return;
            }

            try {
                const idToken = await user.getIdToken();
                localStorage.setItem(TOKEN_KEY, idToken);
                const identificador = user.email || user.phoneNumber || "Invitado";
                usuarioInfo.textContent = `Sesión activa: ${identificador}`;
                listoParaVigilar = true;
            } catch (err) {
                console.error("Error obteniendo token:", err);
                salirDeSesion();
            }
        });

        logoutBtn.addEventListener("click", () => {
            logoutBtn.disabled = true;
            salirDeSesion();
        });
    </script>
</body>
</html>
